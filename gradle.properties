org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships "built-in Kotlin" + a new DSL, which conflicts with applying the standalone
# Kotlin Gradle plugin (kotlin-android) at our own pinned version. Opt out of both so we keep
# the mature KGP flow and control the Kotlin version ourselves via the version catalog.
# (Officially supported bypass through AGP 9; revisit for AGP 10.)
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
