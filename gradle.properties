org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships "built-in Kotlin" + a new DSL. We deliberately opt out of both so we can run our
# own pinned, bleeding-edge Kotlin (2.4.0) via the standalone kotlin-android plugin — AGP 9's
# built-in Kotlin is currently tied to an older KGP. This is an officially supported bypass through
# AGP 9; we'll migrate to built-in Kotlin ahead of AGP 10.
android.builtInKotlin=false
android.newDsl=false
# Silence the (expected) deprecation warnings from the two opt-outs above and the legacy variant API.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL

kotlin.code.style=official
